<!DOCTYPE html>
<html>
  <head>
    <title>Games - KillByte</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="context-menu.js" defer></script>
    <script src="site-settings.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="chat-config.js" defer></script>
    <script src="account.js" defer></script>
    <script src="navigation.js" defer></script>
  </head>
  <body class="details-page games-page">
    <nav class="page-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="Links.html">Links</a>
      <a href="Games.html" aria-current="page">Games</a>
      <a href="browser.html">Browser</a>
      <a href="chat.html">Chat</a>
      <a href="settings.html">Settings</a>
      <div class="sidebar-beta-section">
        <h4 class="sidebar-nav-beta">Beta</h4>
        <hr class="sidebar-nav-divider" aria-hidden="true" />
        <a href="chat.html">Chat</a>
        <a href="Media.html">Media</a>
        <a href="Music.html">Music</a>
      </div>
    </nav>
    <div class="box">
      <h1>Games</h1>
      <section id="game-stage" class="game-stage" aria-label="Game player">
        <div class="iframe-toolbar">
          <span class="fullscreen-title">Killbyte <span aria-hidden="true">/</span> Games</span>
          <button id="game-fullscreen" class="fullscreen-button" type="button">⛶ Fullscreen</button>
        </div>
        <iframe
          id="game-frame"
          src="https://ghost-mathmulti.zeoghost.workers.dev/"
          title="Ghost Math Multi"
          loading="lazy"
          allowfullscreen
        ></iframe>
      </section>
      <div class="box warning-box" id="game-warning">
        <button class="close-button" type="button" aria-label="Close warning" title="Close warning">×</button>
        <h2>Warning!</h2>
        <h3>Many people use this, wait time high!</h3>
      </div>
      <script>
        const gameFrame = document.getElementById("game-frame");
        const gameFullscreen = document.getElementById("game-fullscreen");
        const gameStage = document.getElementById("game-stage");

        gameFullscreen.addEventListener("click", async () => {
          try {
            if (document.fullscreenElement === gameStage) {
              await document.exitFullscreen();
            } else {
              await gameStage.requestFullscreen();
            }
          } catch {
            gameFullscreen.textContent = "Fullscreen unavailable";
          }
        });

        const updateFullscreenLabel = () => {
          gameFullscreen.textContent = document.fullscreenElement === gameStage
            ? "⛶ Exit fullscreen"
            : "⛶ Fullscreen";
        };
        document.addEventListener("fullscreenchange", updateFullscreenLabel);
        window.addEventListener("killbyte:beforeNavigate", () => {
          document.removeEventListener("fullscreenchange", updateFullscreenLabel);
        }, { once: true });

        document.querySelector(".close-button").addEventListener("click", () => {
          document.getElementById("game-warning").remove();
        });
      </script>
    </div>
  </body>
</html>
